[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "umd"
version = "0.1.0"
description = "Universal Media Decomposer — provenance-preserving media decomposition and semantic knowledge service"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
dependencies = [
    # --- Pinned dependency policy ---
    # Constants are pinned by the DD/contracts: FastAPI 0.141.1, Pydantic v2 (2.13.x line),
    # SQLAlchemy 2.0.x, ocfl-py 2.1.0. Other runtime deps ride the latest line but must be
    # reviewed by build/license/CVE gates before release (see artifacts/designs).
    "fastapi==0.141.1",
    "pydantic==2.13.*",
    "sqlalchemy==2.0.*",
    "ocfl-py==2.1.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.3",
    # Validates event payloads against the versioned JSON schemas under schemas/events
    # (P3-S1); the schemas are the published, retained contracts and jsonschema is the
    # reference validator. Pinned to the 0.4.x spec line that supports draft 2020-12.
    "jsonschema>=4.21",
    # Version comparison for projection/vector capability gating (umd/projections/vector.py);
    # previously present only transitively via dev tooling, now a declared runtime dep.
    "packaging==26.3",
    # Text-layer PDF detection (Phase B, P2-S1). pypdf is BSD-3-Clause (permissive,
    # pre-approved by DD/plan alongside pdfplumber), PEP 561-typed, pinned 6.16.x.
    # Used ONLY for text-layer detection; image-only pages route to raster/OCR.
    "pypdf==6.16.2",
    # Bounded raster decode/metadata/crops + deterministic region/panel extraction
    # (Phase B, P3-S1/S3). Pillow is HPND (BSD-like) licensed, pre-approved by the DD
    # raster contract. Decompression-bomb guard + explicit pixel/dimension budget are
    # enforced in umd.raster.bounds. Serves the custom deterministic extractor; the
    # more-common OpenCV path is an optional (gated) enhancement.
    "Pillow==11.3.0",
    # Subtitle format parsing (Phase C, P3-S3): pysubs2 decodes MicroDVD/TMP/SSA
    # in umd.subtitle.formats and reports the parser capability in availability.
    # MIT-licensed, pinned to 1.9.0 per the DD subtitle packaging pin.
    "pysubs2==1.9.0",
    # Bounded multipart uploads (Phase C, P3-S2): FastAPI's `request.form()`
    # (used by the /v1/sources streaming-upload path in umd.api.routers.sources)
    # requires python-multipart at runtime. Pinned to the resolved 0.0.32 line.
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
# OCR provider extras. Tesseract is the CPU/clean-text alternative (apt binary +
# pytesseract); PaddleOCR is the preferred scene/CJK/vertical path but is HEAVY
# (paddlepaddle) and is deliberately NOT installed by default — the adapter is
# written to the OcrProvider contract and gated (recorded in P3-S2 annotations).
# OpenCV is an optional enhanced region path behind the same gate.
ocr = [
    # Apache-2.0; thin wrapper around the tesseract-ocr C binary. Requires the
    # system tesseract binary (e.g. apt install tesseract-ocr); the integration
    # test skips cleanly when the binary is absent.
    "pytesseract==0.3.13",
    # GATED (not force-installed): paddlepaddle + paddleocr. See P3-S2 note.
    # "paddleocr==2.9.*",
]

# ASR provider extras. faster-whisper is the validated self-hostable ASR path
# (P2-S1..S3) but is HEAVY (ctranslate2/onnxruntime/huggingface-hub/av/numpy) and is
# deliberately NOT in the base image — the adapter loads the model only inside the
# sandboxed audio worker (umd.audio.dispatch), never the API process. Model weights
# are separate (Systran/faster-whisper-tiny.en, MIT) and pulled into the env-driven
# UMD_ASR_MODEL_CACHE dir. See deploy/pins/asr-runtime.md for the validated pins.
asr = [
    # MIT-licensed; CTranslate2 CPU Whisper. Pinned to the resolved 1.2.1 line
    # (ctranslate2 4.8.1, onnxruntime 1.29.0) recorded in deploy/pins/asr-runtime.md.
    "faster-whisper==1.2.1",
]

# Hatchet worker extras (GATED, opt-in). Hatchet is the SOLE v1 scheduler/runner;
# the SDK is NOT in the base image — the worker role installs it. Pinned to the
# candidate SDK release recorded in deploy/pins/runtime.txt (1.38.1 <-> server
# v0.105.2), PENDING live shape-test validation in Plan J (not release evidence).
worker = [
    "hatchet-sdk==1.38.1",
]

dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
umd = ["py.typed"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "S", "SIM", "ARG"]
# S (bandit) rules enabled; individual violations marked inline where intended.

[tool.ruff.lint.per-file-ignores]
# Tests shell out to locally-installed Postgres tooling (pg_dump/psql) and build
# SQL identifiers that are internally generated (uuid/table constants, never user
# input). S603/S607: intentional subprocess to trusted fixed-path binaries.
"tests/**" = ["S101", "S105", "S603", "S607", "S608"]

# Single-writer Tier-1 projection builders implement the fixed ProjectionBuilder
# protocol (prepare/wipe/apply/on_skip/on_pause/finalize) even when a specific builder
# does not use every contract argument (e.g. a builder that never pauses). ARG002 would
# otherwise flag those mandatory stub parameters.
"src/umd/projections/**" = ["ARG002"]

# B008: FastAPI dependency injection uses `Depends(...)`/`Query(...)` calls as default
# argument values in route signatures — the standard framework idiom. The v1 REST
# boundary is the only place this applies.
"src/umd/api/**" = ["B008"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/versions"]

[[tool.mypy.overrides]]
# ocfl-py ships no PEP 561 typing; treat it as untyped (its objects are exercised
# by the OCFL fixity tests rather than statically asserted).
module = ["ocfl", "ocfl.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# jsonschema ships no PEP 561 typing either; the event schema validator is
# exercised by the event-version tests rather than statically asserted.
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["migrations.*"]
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
# Pillow ships no PEP 561 typing for the modules we import under erasure; the
# bounded decode/crop logic is exercised by the raster property/integration tests.
module = ["PIL", "PIL.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Optional OCR providers are imported lazily behind try/except gates; none is a
# runtime dependency, so none ships PEP 561 typing that mypy can resolve.
module = ["pytesseract", "paddleocr", "paddleocr.*", "cv2"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# splink + DuckDB linkage is a GATED build gate: the adapter is only active when
# the runtime is truly installed+validated (see umd.resolution.linkage). Neither
# ships PEP 561 typing; imports are defensive probes behind the gate.
module = ["splink", "splink.*", "duckdb"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Optional ASR runtime (faster-whisper + its transitive CTranslate2/decoder deps) is
# imported lazily behind the gate (see umd.audio.asr). None ships PEP 561 typing and
# none is a base dependency; the active path is validated at runtime.
module = [
    "faster_whisper",
    "faster_whisper.*",
    "ctranslate2",
    "ctranslate2.*",
    "tokenizers",
    "onnxruntime",
    "huggingface_hub",
    "huggingface_hub.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Vecalign is a GATED PARALLEL_MONOTONE-only adapter; imports are defensive probes
# behind the gate and it ships no PEP 561 typing.
module = ["vecalign"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "postgres: requires a live PostgreSQL server (env UMD_TEST_POSTGRES=true)",
    "docker: requires the Docker Compose stack (skipped honestly when no Docker daemon)",
    "cluster: requires a live Hatchet cluster (skipped honestly when UMD_HATCHET_*/SDK absent)",
]

[tool.coverage.run]
source = ["umd"]
