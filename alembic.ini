[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# URL is resolved at runtime from env UMD_POSTGRES__DSN or umd.config (see migrations/env.py).
sqlalchemy.url = postgresql+psycopg://umd:umd@127.0.0.1:5432/umd
file_template = %%(rev)s_%%(slug)s
# Exclude the canonical metadata from autogenerate drift reporting differences
# that are (deliberately) python-side (uuid defaults, etc.).
compare_type = true
compare_server_default = false

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S