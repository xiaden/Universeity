# UMD Compose topology (Plan E, P2-S1).
#
# FINAL COMPOSE — targets the DD production baseline:
#   * PostgreSQL **18.6** with **pgvector >= 0.8.2 (target 0.8.6)** for HNSW.
#   * OCFL immutable-byte authority on a named volume (or optional MinIO-
#     compatible S3 bridge profile).
#   * Hatchet durable DAG runner (release pinned as a build gate).
#   * Optional Ollama (GPU/embedding profile; disabled by default).
#   * A dedicated sandbox-runner role behind a documented VALIDATED host
#     profile — see deploy/security/SANDBOX_HOST_PROFILE.md. It runs with an
#     explicitly non-privileged security config (read-only root FS, no-new-
#     privileges, seccomp/AppArmor profile) and NEVER uses a privileged key.
#
# HONESTY NOTE: local dev/CI in this sandbox runs PostgreSQL 17 with pgvector
# 0.8.0 (HNSW stays gated there). The 18.6 + 0.8.6 target is what THIS file
# deploys and what CI/registry build verifies; this environment cannot run
# Docker, so container-level behavior is validated statically here and by the
# conditional Docker integration tests (skipped, not silently passed, when no
# Docker daemon is present).
name: umd

x-umd-api-env: &umd-api-env
  UMD_POSTGRES__DSN: postgresql+psycopg://umd:${UMD_POSTGRES_PASSWORD:-umd}@db:5432/umd
  UMD_OCFL__ROOT: /data/ocfl
  UMD_RUN_MIGRATIONS_ON_START: "1"
  # Gate posture: all authority/security/provider extensions stay GATED and are
  # enabled only through the .env surface (never compiled in, never a hard
  # dependency of the base image).
  UMD_PROJECTION__VECTOR_HNSW_MIN_VERSION: "0.8.2"
  UMD_VLLM_ENABLED: "${UMD_VLLM_ENABLED:-0}"
  UMD_DIARIZATION_ENABLED: "${UMD_DIARIZATION_ENABLED:-0}"
  UMD_ASR_ENGINE: "${UMD_ASR_ENGINE:-}"

services:
  db:
    image: pgvector/pgvector:pg18
    # Target Postgres 18.6 + pgvector >=0.8.2 (target 0.8.6). Registry tag
    # `pg18` currently ships a pgvector >= 0.8.2; release pinning of the
    # concrete image digest is a deployment gate (see deploy/pins/runtime.txt
    # and deploy/security/CVE_WATCH.md).
    environment:
      POSTGRES_USER: umd
      POSTGRES_PASSWORD: ${UMD_POSTGRES_PASSWORD:-umd}
      POSTGRES_DB: umd
    volumes:
      - ocfl-db:/var/lib/postgresql
    # Publish 5432 to the host so the host-run live suite (tests/test_hatchet_live.py,
    # test_api_boundary_e2e.py) can reach the SAME Postgres the in-stack worker/API
    # use via conftest's UMD_PG_HOST/UMD_PG_PORT surface. The live tests must share
    # this database with the compose worker (not a throwaway) for deterministic
    # stage_run/StageCompleted evidence.
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umd -d umd"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      UMD_ROLE: api
      <<: *umd-api-env
      # P3-S3: the API release factory dispatches through ProductionDAGRunner to the
      # sole v1 scheduler, so it consumes the SAME real-tenant-JWT Hatchet surface as
      # the worker (build_hatchet_client reads these env vars). gRPC host_port routes
      # to the ENGINE (7070), never the dashboard.
      UMD_HATCHET_SERVER_URL: http://hatchet-dashboard:8080
      UMD_HATCHET_TOKEN: ${HATCHET_TENANT_TOKEN:-}
      HATCHET_CLIENT_HOST_PORT: hatchet-engine:7070
    env_file:
      - path: ../.env.example
        required: false
    volumes:
      - ocfl-data:/data/ocfl
      - umd-api-secrets:/run/secrets:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${UMD_API_PORT:-8080}:8080"
    healthcheck:
      # Readiness gate: /v1/health must return 200 while dependencies degrade.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/v1/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      # P3-S2: the worker role uses the `worker` build target (installs the pinned
      # `.[worker]` extra + SDK import smoke test); the API stays on the lean base.
      target: worker
    command: ["worker"]
    environment:
      UMD_ROLE: worker
      <<: *umd-api-env
      # Hatchet worker configuration. UMD_HATCHET_TOKEN MUST be a REAL tenant JWT
      # (minted after hatchet-admin config generation via `hatchet-admin token
      # create --config /hatchet/config --tenant-id <uuid>`); the umd-ci-token
      # placeholder is NOT a JWT and can never register. HATCHET_CLIENT_HOST_PORT
      # routes the worker's gRPC admin channel to the ENGINE (7070), never the
      # dashboard. UMD_HATCHET_SERVER_URL is the dashboard HTTP URL (required by
      # the worker gate; the gRPC host_port override bypasses the URL hostname).
      UMD_HATCHET_SERVER_URL: http://hatchet-dashboard:8080
      UMD_HATCHET_TOKEN: ${HATCHET_TENANT_TOKEN:-}
      HATCHET_CLIENT_HOST_PORT: hatchet-engine:7070
    env_file:
      - path: ../.env.example
        required: false
    volumes:
      - ocfl-data:/data/ocfl
    depends_on:
      db:
        condition: service_healthy
      hatchet-engine:
        condition: service_started
    restart: unless-stopped

  # ---- Hatchet split topology (sole v1 scheduler) ---------------------------
  # Real ghcr.io sub-path images at the pinned release. The top-level
  # `ghcr.io/hatchet-dev/hatchet` reference is DENIED on ghcr.io and must never be
  # used. Order: hatchet-migrate -> hatchet-admin (setup-config generates the
  # /hatchet/config) -> hatchet-engine (gRPC 7070) + hatchet-dashboard (:80).
  hatchet-migrate:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-migrate:${HATCHET_VERSION:-v0.105.2}
    command: /hatchet/hatchet-migrate
    environment:
      DATABASE_URL: postgres://umd:${UMD_POSTGRES_PASSWORD:-umd}@db:5432/umd
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  hatchet-admin:
    # setup-config: generates the shared /hatchet/config consumed by engine and
    # dashboard. Postgres doubles as the message broker (SERVER_MSGQUEUE_KIND=postgres),
    # so no RabbitMQ service is needed. C7: HATCHET_COOKIE_SECRET / HATCHET_MASTER_KEY
    # stay required ${VAR:?} interpolations.
    image: ghcr.io/hatchet-dev/hatchet/hatchet-admin:${HATCHET_VERSION:-v0.105.2}
    command: /hatchet/hatchet-admin quickstart --skip certs --generated-config-dir /hatchet/config --overwrite=false
    environment:
      DATABASE_URL: postgres://umd:${UMD_POSTGRES_PASSWORD:-umd}@db:5432/umd
      SERVER_MSGQUEUE_KIND: postgres
      SERVER_AUTH_COOKIE_SECRET: ${HATCHET_COOKIE_SECRET:?}
      SERVER_ENCRYPTION_MASTER_KEY: ${HATCHET_MASTER_KEY:?}
      SERVER_AUTH_COOKIE_DOMAIN: localhost:8080
      SERVER_AUTH_COOKIE_INSECURE: "t"
      SERVER_GRPC_BIND_ADDRESS: "0.0.0.0"
      SERVER_GRPC_INSECURE: "t"
      SERVER_GRPC_BROADCAST_ADDRESS: hatchet-engine:7070
      SERVER_INTERNAL_CLIENT_INTERNAL_GRPC_BROADCAST_ADDRESS: hatchet-engine:7070
    volumes:
      - hatchet-config:/hatchet/config
      - hatchet-certs:/hatchet/certs
    depends_on:
      hatchet-migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    restart: on-failure

  hatchet-engine:
    # The scheduler/runner surface the SDK reaches over gRPC (default 7070). The
    # host mapping keeps the published port 7070 so cli.worker's default host_port
    # derivation and the in-network test runner both route here, not the dashboard.
    image: ghcr.io/hatchet-dev/hatchet/hatchet-engine:${HATCHET_VERSION:-v0.105.2}
    command: /hatchet/hatchet-engine --config /hatchet/config
    environment:
      DATABASE_URL: postgres://umd:${UMD_POSTGRES_PASSWORD:-umd}@db:5432/umd
      SERVER_GRPC_BIND_ADDRESS: "0.0.0.0"
      SERVER_GRPC_INSECURE: "t"
    ports:
      - "7070:7070"
    volumes:
      - hatchet-config:/hatchet/config
      - hatchet-certs:/hatchet/certs
    depends_on:
      hatchet-admin:
        condition: service_completed_successfully
      hatchet-migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    restart: on-failure

  hatchet-dashboard:
    # The HTTP UI (host 8081 -> container :80). Not the gRPC surface; no worker
    # ever routes its admin channel here.
    image: ghcr.io/hatchet-dev/hatchet/hatchet-dashboard:${HATCHET_VERSION:-v0.105.2}
    command: sh ./entrypoint.sh --config /hatchet/config
    environment:
      DATABASE_URL: postgres://umd:${UMD_POSTGRES_PASSWORD:-umd}@db:5432/umd
    ports:
      - "${HATCHET_DASHBOARD_PORT:-8081}:80"
    volumes:
      - hatchet-config:/hatchet/config
      - hatchet-certs:/hatchet/certs
    depends_on:
      hatchet-admin:
        condition: service_completed_successfully
      hatchet-migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    restart: on-failure

  # ---- OPTIONAL / profile-gated ---------------------------------------------
  sandbox-runner:
    # Dedicated, OPT-IN sandbox executor profile (no media stages in base). Uses
    # the same API/worker image but runs with a DOCUMENTED VALIDATED non-
    # privileged posture (deploy/security/SANDBOX_HOST_PROFILE.md): read-only
    # root, no-new-privileges, cap_drop ALL, tmpfs scratch, seccomp. Never
    # `privileged: true`.
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: worker
    command: ["worker"]
    profiles: ["sandbox"]
    environment:
      UMD_ROLE: worker
      UMD_SANDBOX_PROFILE: documented-validated-nonprivileged
      <<: *umd-api-env
    volumes:
      - ocfl-data:/data/ocfl:ro
      - sandbox-tmp:/tmp
    read_only: true
    security_opt:
      - no-new-privileges:true
      - seccomp=deploy/security/sandbox-seccomp.json
    tmpfs:
      - /scratch
    cap_drop:
      - ALL
    restart: unless-stopped

  ollama:
    # Optional local embedding/LLM host (kept out of default up).
    image: ollama/ollama:latest
    profiles: ["gpu"]
    volumes:
      - ollama-cache:/root/.ollama
    restart: unless-stopped

  minio:
    # Optional MinIO(-compatible) bridge for OCFL object bytes. Mount the S3
    # path as the OCFL root in the API/worker env when enabled (profile).
    image: minio/minio:latest
    profiles: ["s3bridge"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-umd}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-umdminio}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  ocfl-db:
  ocfl-data:
  umd-api-secrets:
  sandbox-tmp:
  ollama-cache:
  minio-data:
  # Hatchet split-topology shared state (engine + dashboard both mount these).
  hatchet-config:
  hatchet-certs: